[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "xgboost-metal"
version = "3.5.0.dev0"
description = "GPU-accelerated gradient boosting for Apple silicon with the XGBoost Python API"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy", "scipy"]

[project.urls]
Repository = "https://github.com/tabulai/xgboost-metal"
Documentation = "https://github.com/tabulai/xgboost-metal#documentation"
Issues = "https://github.com/tabulai/xgboost-metal/issues"

[project.optional-dependencies]
sklearn = ["scikit-learn", "pandas"]
test = ["pytest", "scikit-learn", "pandas", "pyarrow"]

[tool.scikit-build]
wheel.packages = ["python-package/xgboost"]
wheel.py-api = "py3"
wheel.license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "third_party/nlohmann/LICENSE.MIT", "third_party/llvm/LICENSE.TXT"]
cmake.build-type = "Release"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "14.0"
build-dir = "build/{wheel_tag}"
sdist.exclude = ["ref", ".bootstrap", ".venv", ".wheel-venv", "build-reference", "benchmark-results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python-package"]
